name: Update app list

# Finds repos tagged "walshclassroom" and rebuilds data/repos.json plus the teacher explainer pages.
on:
  schedule:
    - cron: "17 10 * * *"   # every day, about 6 a.m. Eastern
  workflow_dispatch:         # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: [apps.js]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-app-list.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if anything changed
        run: |
          git add data teachers
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update app list"
          git push
