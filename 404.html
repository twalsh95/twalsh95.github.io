<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Unbounded:wght@700;800&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/wc.css">
  <title>Page not found | Walsh Classroom</title>
  <style>
    .nf { min-height: calc(100vh - 69px); display: grid; place-items: center; text-align: center; padding: 48px 16px; }
    .nf .mark { width: 120px; color: var(--raspberry); margin: 0 auto 28px; transform: rotate(-8deg); }
    .nf h1 { font-size: clamp(32px, 6vw, 64px); max-width: 16ch; margin: 0 auto; }
    .nf p { color: var(--ink-2); margin: 18px auto 28px; max-width: 40ch; }
  </style>
</head>
<body>
  <header id="site-header"></header>
  <main class="nf">
    <div>
      <span class="mark" aria-hidden="true"></span>
      <h1 class="display">This scene didn't make the final cut.</h1>
      <p>That page isn't here. It may have moved, or the link has a typo.</p>
      <a class="btn" href="/">Back to all the apps</a>
    </div>
  </main>
  <script src="/assets/site.js"></script>
</body>
</html>
